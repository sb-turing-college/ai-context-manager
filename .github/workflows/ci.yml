name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # .env is gitignored; unit tests mock LLM clients and do not call providers
      GOOGLE_API_KEY: ci-dummy-key-not-used-in-unit-tests
      ANTHROPIC_API_KEY: ci-dummy-key-not-used-in-unit-tests
      DISCLAIMER_ACCEPTED: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # vitest watch would hang; `run` is the CI-safe once mode
      - run: npx vitest run
      - run: npm run build
